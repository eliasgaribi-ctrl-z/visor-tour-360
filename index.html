<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: deja que la página use el área bajo el notch y la
         barra de gestos; los env(safe-area-inset-*) del HUD hacen el resto.
         maximum-scale=1 + user-scalable=no: sin esto, el pellizco para hacer
         zoom en la panorámica hace zoom en la PÁGINA. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Recorrido virtual 360</title>
  </head>
  <!-- El fondo va aquí en línea, y no solo en index.css, porque tiene que estar
       ANTES de que la hoja cargue: sin él se ve un flash blanco. Y como un estilo
       inline gana a cualquier hoja, la regla de index.css nunca llegaba a aplicar.
       Con la variable, la marca de una inmobiliaria puede cambiarlo y el valor de
       respaldo sigue siendo el mismo de siempre. Ver src/lib/marca.ts. -->
  <body style="margin: 0; background: var(--fondo-app, #0b0f19)">
    <div id="root"></div>

    <!-- ─────────────────────────────────────────────────────────────────────
         RED DE SEGURIDAD DEL ARRANQUE

         Todo lo de abajo es HTML plano y JavaScript de los de antes (nada de
         const, arrow functions ni módulos), justamente porque tiene que poder
         ejecutarse en el navegador donde el visor NO arrancó.

         Si React monta bien, esto nunca se ve. Si no monta —sintaxis que el
         Safari del teléfono no entiende, un error al cargar el bundle, lo que
         sea— en vez de una pantalla negra sin explicación aparece un mensaje
         con la causa exacta y con qué teléfono es.
    ────────────────────────────────────────────────────────────────────── -->
    <div
      id="respaldo"
      style="display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
             overflow: auto; padding: 22px;
             background: #0b0f19; color: #e8eaf0; font: 15px/1.55 -apple-system,
             BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    >
      <p style="color: #e19100; font-size: 19px; font-weight: 700; margin: 0 0 10px">
        El visor no pudo arrancar en este navegador
      </p>
      <p style="margin: 0 0 18px; color: #d2d4d7">
        La página sí cargó, pero el motor 3D no. Abajo está el motivo — mándame
        una foto de esta pantalla y lo arreglo.
      </p>
      <div
        id="respaldo-motivo"
        style="background: #131a2a; border-radius: 12px; padding: 12px; font-family:
               ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
               color: #ff9d9d; word-break: break-word; white-space: pre-wrap"
      ></div>
      <div
        id="respaldo-equipo"
        style="margin-top: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
               font-size: 11px; color: #8892a6; word-break: break-word"
      ></div>
    </div>

    <script>
      (function () {
        var motivos = [];

        function apunta(txt) {
          if (txt && motivos.length < 4) motivos.push(txt);
        }

        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && e.target.src) {
            apunta('No se pudo cargar el archivo: ' + e.target.src);
          } else {
            apunta((e && e.message) || 'error desconocido');
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          apunta('Promesa rechazada: ' + ((e && e.reason && e.reason.message) || e.reason));
        });

        /* Se revisa varias veces, no una sola.
           "#root tiene hijos" NO significa "montó bien": las pantallas pesadas
           se cargan por trozos y mientras llegan hay un velo de espera, que
           también es un hijo. Con una sola revisión a los 5 s, la red se
           descartaba sola en cuanto aparecía ese velo — y si el trozo no
           llegaba nunca, nadie avisaba. Por eso se mira si lo único que hay es
           un cargando (data-cargando) y en ese caso se vuelve a intentar. */
        var intentos = 0;

        function revisar() {
          var raiz = document.getElementById('root');
          var vivo = raiz && raiz.children.length > 0;
          var esperando = raiz && raiz.querySelector('[data-cargando]');

          if (vivo && !esperando) return;              // montó de verdad
          if (esperando && intentos < 4) {             // sigue cargando un trozo
            intentos++;
            setTimeout(revisar, 5000);
            return;
          }

          var caja = document.getElementById('respaldo');
          document.getElementById('respaldo-motivo').textContent =
            motivos.length ? motivos.join('\n\n') : 'El bundle no arrojó ningún error: lo más probable es que este navegador no entienda la sintaxis con la que está compilado.';
          document.getElementById('respaldo-equipo').textContent = navigator.userAgent;
          caja.style.display = 'block';
        }

        setTimeout(revisar, 5000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
